[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queue-bot"
version = "0.1.0"
description = "Telegram bot for managing student queues and schedules."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Timofey" }
]
dependencies = [
  "aiogram>=3.20.0,<3.27.0",
  "aiosqlite==0.20.0",
  "aiohttp>=3.11.0,<3.13.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.0.0",
  "mkdocstrings[python]>=0.24.0",
  "griffe>=0.38.0",
]
dev = [
  "build>=1.2.2",
  "setuptools>=69.0",
  "wheel>=0.43.0",
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.0.0",
  "mkdocstrings[python]>=0.24.0",
  "griffe>=0.38.0",
]

[project.scripts]
queue-bot = "queue_bot.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["queue_bot*"]

[tool.setuptools.package-data]
queue_bot = ["index.html"]
