# mkdocs.yml
site_name: Queue Bot Documentation
site_description: Документация Telegram бота для управления очередью
site_author: Timofey
repo_url: https://github.com/GrafZLaa/queue-bot
repo_name: GrafZLaa/queue-bot

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_bases: true
            show_submodules: true
            docstring_style: google  # или numpy, sphinx

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Project:
    - Requirements: project/requirements.md
    - Architecture: project/architecture.md
    - Defense: project/defense.md
  - API Reference:
    - Bot: api/bot.md
  - Guide:
    - Installation: guide/installation.md
    - Configuration: guide/configuration.md
    - Deployment: guide/deployment.md

hooks:
  - docs/hooks.py
